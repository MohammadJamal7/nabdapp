name: nabdapp
description: "Nabd - Elderly Healthcare Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1

  dio: ^5.7.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  go_router: ^14.6.2

  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  intl: ^0.20.1

  uuid: ^4.5.1

  jwt_decoder: ^2.0.1

  signalr_netcore: ^1.3.7

  firebase_messaging: ^15.2.4
  firebase_core: ^3.12.1

  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true