<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background -->
  <rect width="1024" height="1024" rx="180" ry="180" fill="#4A90D9"/>
  
  <!-- Heart/Pulse Icon -->
  <g transform="translate(512, 512)" fill="none" stroke="white" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart shape -->
    <path d="M0,120 C-140,40 -200,-80 -200,-140 C-200,-240 -120,-280 -60,-280 C-20,-280 0,-240 0,-200 C0,-240 20,-280 60,-280 C120,-280 200,-240 200,-140 C200,-80 140,40 0,120 Z" fill="white" stroke="none"/>
    
    <!-- Pulse line across heart -->
    <path d="M-180,0 L-120,0 L-80,-60 L-40,60 L0,0 L40,0" stroke="#4A90D9" stroke-width="32" fill="none"/>
  </g>
  
  <!-- Letter N badge -->
  <circle cx="800" cy="800" r="140" fill="#2E5A8C"/>
  <text x="800" y="860" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="white" text-anchor="middle">N</text>
</svg>
